<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}GoodDeeds{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

    <!-- Common Styles -->
    <style>
        /* ============================================================
           DESIGN SYSTEM – CSS Variables
           ============================================================ */
        :root {
            --bg: #f7f7f8;
            --card-bg: #ffffff;
            --text: #0a0a0a;
            --text-secondary: #737373;
            --border: #e5e5e5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.08);
            --green-primary: #2e7d32;
            --green-light: #e8f5e9;
            --green-dark: #1b5e20;
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-height: 64px;
            --header-height: 60px;
        }

        body.dark {
            --bg: #0a0a0a;
            --card-bg: #181818;
            --text: #f5f5f5;
            --text-secondary: #a0a0a0;
            --border: #2a2a2a;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.6);
            --green-light: #1a3a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            padding-bottom: calc(var(--nav-height) + 20px);
            padding-top: var(--header-height);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        a { text-decoration: none; color: var(--green-primary); }
        a:hover { color: var(--green-dark); }
        ::selection { background: var(--green-primary); color: white; }

        /* ============================================================
           HEADER (Fixed, glass)
           ============================================================ */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1050;
            height: var(--header-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            transition: background 0.3s, border-color 0.3s;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }
        .header .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .header .logo i {
            color: var(--green-primary);
            margin-right: 6px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }
        .header-actions .btn-icon {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 22px;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions .btn-icon:hover {
            background: rgba(0, 0, 0, 0.06);
        }
        body.dark .header-actions .btn-icon:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .header-actions .btn-icon .badge-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: #ed4956;
            border-radius: 50%;
            border: 2px solid var(--card-bg);
        }
        .avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            transition: var(--transition);
            cursor: pointer;
        }
        .avatar-small:hover {
            border-color: var(--green-primary);
            transform: scale(1.04);
        }

        .auth-btn {
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            transition: var(--transition);
            border: none;
            background: var(--green-primary);
            color: white;
        }
        .auth-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(46, 125, 50, 0.3);
        }
        .auth-btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .auth-btn-outline:hover {
            background: var(--border);
        }

        /* ============================================================
           BOTTOM NAVIGATION (mobile)
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1050;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 8px;
        }
        .bottom-nav .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            padding: 8px 12px;
            border-radius: 30px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-weight: 500;
            font-size: 12px;
            gap: 2px;
            text-decoration: none;
            cursor: pointer;
        }
        .bottom-nav .nav-item i {
            font-size: 24px;
            transition: var(--transition);
        }
        .bottom-nav .nav-item span {
            font-size: 10px;
            letter-spacing: 0.3px;
        }
        .bottom-nav .nav-item.active {
            color: var(--green-primary);
        }
        .bottom-nav .nav-item.active i {
            transform: scale(1.1);
        }
        .bottom-nav .nav-item:hover {
            color: var(--text);
        }
        body.dark .bottom-nav .nav-item:hover {
            color: white;
        }
        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 20px; }
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 576px) {
            :root { --header-height: 56px; }
            .header .logo { font-size: 20px; }
        }
        @media (min-width: 768px) {
            .container { max-width: 640px; }
        }
    </style>

    <!-- Additional per‑page styles -->
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- ============================================================
         HEADER
         ============================================================ -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-leaf"></i> GoodDeeds
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="darkModeToggle" title="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="auth-btn auth-btn-outline" style="font-size:13px;padding:4px 12px;">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
                <img src="https://ui-avatars.com/api/?name={{ user.username }}&background=2e7d32&color=fff&size=36"
                     class="avatar-small" alt="{{ user.username }}" title="{{ user.username }}">
            {% else %}
                <a href="{% url 'login' %}" class="auth-btn">Login</a>
                <a href="{% url 'register' %}" class="auth-btn auth-btn-outline">Sign Up</a>
            {% endif %}
        </div>
    </header>

    <!-- ============================================================
         MAIN CONTENT (overridden by child templates)
         ============================================================ -->
    <main class="container py-3">
        {% block content %}{% endblock %}
    </main>

    <!-- ============================================================
         BOTTOM NAVIGATION (mobile)
         ============================================================ -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="alert('Challenges coming soon!')">
            <i class="fas fa-tasks"></i>
            <span>Challenges</span>
        </a>
        <a href="#" class="nav-item" onclick="alert('Rewards coming soon!')">
            <i class="fas fa-gift"></i>
            <span>Rewards</span>
        </a>
        <a href="#" class="nav-item" onclick="alert('Profile coming soon!')">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- ============================================================
         COMMON SCRIPTS (dark mode, etc.)
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Dark mode (shared)
        const darkToggle = document.getElementById('darkModeToggle');
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
            if (darkToggle) {
                darkToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
        }
        if (darkToggle) {
            darkToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark');
                const isDark = document.body.classList.contains('dark');
                localStorage.setItem('darkMode', isDark);
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-moon');
                icon.classList.toggle('fa-sun');
            });
        }

        // Toast function (for alerts)
        function showToast(message, type = 'success') {
            // You can implement a proper toast here if you add Bootstrap toast
            alert(message);
        }
    </script>

    <!-- Per‑page scripts -->
    {% block extra_js %}{% endblock %}
</body>
</html>
