{% extends 'admin_panel/base_admin.html' %}

{% block content %}
<h3 class="mb-4">Dashboard</h3>
<div class="row g-4">
    <div class="col-md-3">
        <div class="stats-card">
            <div class="number">{{ total_users }}</div>
            <div class="label">Total Users</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stats-card">
            <div class="number">{{ total_posts }}</div>
            <div class="label">Total Posts</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stats-card">
            <div class="number">{{ total_challenges }}</div>
            <div class="label">Challenges</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stats-card">
            <div class="number">{{ pending_challenges }}</div>
            <div class="label">Pending Challenges</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stats-card">
            <div class="number">{{ total_rewards }}</div>
            <div class="label">Rewards</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stats-card">
            <div class="number">{{ total_sponsors }}</div>
            <div class="label">Active Sponsors</div>
        </div>
    </div>
</div>
{% endblock %}
