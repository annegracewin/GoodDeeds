{% extends 'admin_panel/base_admin.html' %}

{% block content %}
<div class="card">
    <div class="card-body text-center">
        <h5>Delete {{ type }}: {{ object }}</h5>
        <p>Are you sure you want to delete this {{ type|lower }}? This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% if type == 'Sponsor' %}{% url 'admin_panel:sponsors' %}{% elif type == 'Reward' %}{% url 'admin_panel:rewards' %}{% else %}{% url 'admin_panel:challenges' %}{% endif %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
