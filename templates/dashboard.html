{% extends 'base.html' %}

{% block title %}Dashboard – GoodDeeds{% endblock %}

{% block extra_css %}
<style>
    /* Dashboard specific styles */
    .stories-wrapper {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 20px;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-shrink: 0;
    }
    .stories-wrapper::-webkit-scrollbar { display: none; }
    .story-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.2s;
    }
    .story-item:hover { transform: translateY(-2px); }
    .story-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        padding: 2px;
        background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        transition: transform 0.2s;
    }
    .story-ring:hover { transform: scale(1.05); }
    .story-ring img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--card-bg);
        object-fit: cover;
    }
    .story-ring.add-story {
        background: var(--border);
    }
    .story-ring.add-story .add-icon {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--bg);
        border: 2px solid var(--card-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: var(--text-secondary);
    }
    .story-name {
        font-size: 11px;
        margin-top: 6px;
        color: var(--text-secondary);
        max-width: 64px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
    }

    .tab-bar {
        display: flex;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 4px;
        margin-bottom: 20px;
    }
    .tab-btn {
        flex: 1;
        padding: 10px 0;
        text-align: center;
        border: none;
        background: transparent;
        border-radius: var(--radius-sm);
        font-weight: 600;
        font-size: 14px;
        color: var(--text-secondary);
        transition: var(--transition);
        cursor: pointer;
    }
    .tab-btn i { margin-right: 6px; font-size: 15px; }
    .tab-btn.active {
        background: var(--green-primary);
        color: white;
        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
    }
    .tab-btn:not(.active):hover { background: rgba(0,0,0,0.04); }
    body.dark .tab-btn:not(.active):hover { background: rgba(255,255,255,0.06); }

    /* post card etc. – include from previous version */
    .post-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 20px;
        overflow: hidden;
        transition: var(--transition);
    }
    .post-card:hover {
        box-shadow: var(--shadow-hover);
        transform: translateY(-2px);
    }
    .post-header {
        display: flex;
        align-items: center;
        padding: 14px 16px;
    }
    .post-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 12px;
        border: 2px solid var(--border);
    }
    .post-user {
        font-weight: 600;
        font-size: 15px;
        color: var(--text);
        flex: 1;
    }
    .post-user:hover { text-decoration: underline; }
    .post-time {
        font-size: 12px;
        color: var(--text-secondary);
        margin-left: 8px;
    }
    .post-more {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 18px;
        padding: 0 4px;
        cursor: pointer;
    }
    .post-more:hover { color: var(--text); }

    .post-image-wrapper {
        position: relative;
        background: var(--bg);
        overflow: hidden;
    }
    .post-image {
        width: 100%;
        max-height: 600px;
        object-fit: cover;
        display: block;
        transition: transform 0.4s;
    }
    .post-card:hover .post-image { transform: scale(1.01); }

    .verification-overlay {
        position: absolute;
        top: 14px;
        right: 14px;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 4px 14px;
        border-radius: 30px;
        font-size: 12px;
        font-weight: 600;
        color: white;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(255,255,255,0.1);
    }
    .verification-overlay.verified { background: rgba(46,125,50,0.85); }
    .verification-overlay.pending { background: rgba(255,179,0,0.85); }

    .points-overlay {
        position: absolute;
        bottom: 14px;
        left: 14px;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        padding: 4px 16px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
        color: #a5d6a7;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(255,255,255,0.05);
    }
    .points-overlay i { color: #66bb6a; }

    .post-actions {
        display: flex;
        align-items: center;
        padding: 8px 16px;
        gap: 18px;
    }
    .post-actions .action-btn {
        background: none;
        border: none;
        font-size: 24px;
        color: var(--text);
        padding: 6px;
        transition: var(--transition);
        cursor: pointer;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .post-actions .action-btn:hover {
        background: rgba(0,0,0,0.06);
        transform: scale(1.1);
    }
    body.dark .post-actions .action-btn:hover {
        background: rgba(255,255,255,0.08);
    }
    .post-actions .action-btn.liked {
        color: #ed4956;
    }
    .post-actions .action-btn.liked:hover {
        background: #fde8e8;
    }
    .post-actions .action-spacer { flex: 1; }

    .post-meta {
        padding: 0 16px 4px;
        font-size: 14px;
        color: var(--text-secondary);
    }
    .post-meta .like-count {
        font-weight: 600;
        color: var(--text);
    }

    .post-caption {
        padding: 0 16px 8px;
    }
    .post-caption .username {
        font-weight: 600;
        font-size: 14px;
        color: var(--text);
    }
    .post-caption .caption-text {
        font-size: 14px;
        color: var(--text);
        margin-left: 4px;
    }
    .post-caption .caption-text .hashtag {
        color: #0095f6;
        font-weight: 500;
    }
    .post-caption .caption-text .hashtag:hover { text-decoration: underline; }

    .post-comments {
        padding: 0 16px 8px;
        font-size: 13px;
        color: var(--text-secondary);
    }
    .post-comments .comment .cm-username {
        font-weight: 600;
        color: var(--text);
        margin-right: 4px;
    }
    .post-comments .view-all {
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 13px;
    }
    .post-comments .view-all:hover { color: var(--text); }

    .post-timestamp {
        padding: 0 16px 12px;
        font-size: 11px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .empty-state {
        text-align: center;
        padding: 60px 20px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
    }
    .empty-state .icon-wrapper {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: var(--green-light);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
    }
    .empty-state .icon-wrapper i {
        font-size: 44px;
        color: var(--green-primary);
    }
    .empty-state h4 {
        font-weight: 700;
        font-size: 22px;
        color: var(--text);
    }
    .empty-state p {
        color: var(--text-secondary);
        max-width: 380px;
        margin: 8px auto 24px;
    }
    .empty-state .btn-primary {
        background: var(--green-primary);
        border: none;
        border-radius: 30px;
        padding: 12px 40px;
        font-weight: 600;
        transition: var(--transition);
        color: white;
    }
    .empty-state .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(46,125,50,0.35);
        background: var(--green-dark);
    }

    .loading-state {
        text-align: center;
        padding: 60px 20px;
    }
    .loading-state .leaf-spin {
        font-size: 48px;
        color: var(--green-primary);
        animation: spin 1.2s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p {
        color: var(--text-secondary);
        margin-top: 12px;
        font-weight: 500;
    }

    .fade-in {
        animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .modal-content {
        border-radius: 28px;
        border: none;
        background: var(--card-bg);
        color: var(--text);
        box-shadow: 0 30px 80px rgba(0,0,0,0.2);
    }
    .modal-header {
        border-bottom: 1px solid var(--border);
        padding: 24px 28px 16px;
    }
    .modal-header .btn-close {
        filter: var(--btn-close-filter, none);
    }
    body.dark .modal-header .btn-close { filter: invert(1); }
    .modal-body { padding: 24px 28px; }
    .modal-footer {
        border-top: 1px solid var(--border);
        padding: 16px 28px 24px;
    }
    .modal .form-control {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        transition: var(--transition);
    }
    .modal .form-control:focus {
        border-color: var(--green-primary);
        box-shadow: 0 0 0 3px rgba(46,125,50,0.15);
    }
    .modal .form-label {
        font-weight: 600;
        font-size: 13px;
        color: var(--text-secondary);
    }

    @media (max-width: 576px) {
        .story-ring { width: 54px; height: 54px; }
        .post-actions .action-btn { font-size: 20px; width: 38px; height: 38px; }
        .post-image { max-height: 400px; }
        .tab-btn { font-size: 12px; padding: 8px 0; }
        .tab-btn i { margin-right: 4px; }
        .empty-state { padding: 40px 16px; }
    }
</style>
{% endblock %}

{% block content %}
    <!-- Stories Row -->
    <div class="stories-wrapper" id="storiesContainer">
        <div class="loading-state" style="padding:8px;text-align:center;color:var(--text-secondary);width:100%;font-size:14px;">
            <i class="fas fa-spinner fa-spin"></i> Loading stories...
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar" id="tabContainer">
        <button class="tab-btn active" data-type="all">
            <i class="fas fa-home"></i> For You
        </button>
        <button class="tab-btn" data-type="verified">
            <i class="fas fa-check-circle"></i> Verified
        </button>
        <button class="tab-btn" data-type="trending">
            <i class="fas fa-fire"></i> Trending
        </button>
    </div>

    <!-- Feed -->
    <div id="feedContainer">
        <div class="loading-state">
            <i class="fas fa-leaf leaf-spin"></i>
            <p>Loading good deeds...</p>
        </div>
    </div>

    <!-- Create Post Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-leaf text-success me-2"></i>Share Your Good Deed</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">What did you do?</label>
                        <textarea class="form-control" id="caption" rows="3" placeholder="Planted trees, cleaned a beach, donated food..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input class="form-control" id="location" placeholder="Where did this happen?">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hashtags</label>
                        <input class="form-control" id="hashtags" placeholder="e.g., CleanBeach PlantATree">
                    </div>
                    <div class="mb-0">
                        <label class="form-label">Image URL</label>
                        <input class="form-control" id="imageUrl" value="https://picsum.photos/800/600">
                        <small class="text-muted">Paste an image URL or leave the default.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success" onclick="createPost()">
                        <i class="fas fa-leaf me-1"></i> Share
                    </button>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script>
        // Dashboard-specific JavaScript
        const API_BASE = '/api';
        const feedContainer = document.getElementById('feedContainer');
        const storiesContainer = document.getElementById('storiesContainer');
        const tabContainer = document.getElementById('tabContainer');

        // Load stories
        function loadStories() {
            fetch(`${API_BASE}/users/`)
                .then(res => { if (!res.ok) throw new Error('API error'); return res.json(); })
                .then(users => {
                    if (users.length === 0) {
                        storiesContainer.innerHTML = `
                            <div class="story-item" onclick="alert('Your profile')">
                                <div class="story-ring"><img src="https://ui-avatars.com/api/?name=You&background=2e7d32&color=fff&size=64" alt="You"></div>
                                <span class="story-name">You</span>
                            </div>
                            <div class="story-item" onclick="alert('Add Story coming soon!')">
                                <div class="story-ring add-story"><div class="add-icon"><i class="fas fa-plus"></i></div></div>
                                <span class="story-name">Add</span>
                            </div>
                        `;
                        return;
                    }
                    const storiesHtml = users.slice(0, 10).map(user => `
                        <div class="story-item" onclick="alert('View ${user.username}\'s profile')">
                            <div class="story-ring">
                                <img src="${user.profile_pic || 'https://ui-avatars.com/api/?name=' + user.username + '&background=2e7d32&color=fff&size=64'}" alt="${user.username}">
                            </div>
                            <span class="story-name">${user.username}</span>
                        </div>
                    `).join('');
                    storiesContainer.innerHTML = `
                        ${storiesHtml}
                        <div class="story-item" onclick="alert('Add Story coming soon!')">
                            <div class="story-ring add-story"><div class="add-icon"><i class="fas fa-plus"></i></div></div>
                            <span class="story-name">Add</span>
                        </div>
                    `;
                })
                .catch(() => {
                    // fallback
                    storiesContainer.innerHTML = `
                        <div class="story-item"><div class="story-ring"><img src="https://ui-avatars.com/api/?name=You&background=2e7d32&color=fff&size=64"></div><span class="story-name">You</span></div>
                        <div class="story-item"><div class="story-ring"><img src="https://ui-avatars.com/api/?name=Alice&background=2196F3&color=fff&size=64"></div><span class="story-name">Alice</span></div>
                        <div class="story-item"><div class="story-ring"><img src="https://ui-avatars.com/api/?name=Bob&background=FF9800&color=fff&size=64"></div><span class="story-name">Bob</span></div>
                        <div class="story-item"><div class="story-ring"><img src="https://ui-avatars.com/api/?name=Carol&background=4CAF50&color=fff&size=64"></div><span class="story-name">Carol</span></div>
                        <div class="story-item"><div class="story-ring"><img src="https://ui-avatars.com/api/?name=Dave&background=F44336&color=fff&size=64"></div><span class="story-name">Dave</span></div>
                        <div class="story-item"><div class="story-ring add-story"><div class="add-icon"><i class="fas fa-plus"></i></div></div><span class="story-name">Add</span></div>
                    `;
                });
        }

        // Load feed
        function loadFeed(type = 'all') {
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            const activeTab = document.querySelector(`.tab-btn[data-type="${type}"]`);
            if (activeTab) activeTab.classList.add('active');

            feedContainer.innerHTML = `
                <div class="loading-state">
                    <i class="fas fa-leaf leaf-spin"></i>
                    <p>Loading good deeds...</p>
                </div>
            `;

            fetch(`${API_BASE}/feed/?type=${type}`)
                .then(res => { if (!res.ok) throw new Error('API error'); return res.json(); })
                .then(data => {
                    if (data.length === 0) renderEmptyState();
                    else renderPosts(data);
                })
                .catch(() => renderMockPosts());
        }

        function renderPosts(posts) {
            if (!posts || posts.length === 0) { renderEmptyState(); return; }

            feedContainer.innerHTML = posts.map(post => {
                const isVerified = post.is_verified;
                const badgeClass = isVerified ? 'verified' : 'pending';
                const badgeIcon = isVerified ? 'fa-check-circle' : 'fa-clock';
                const badgeText = isVerified ? 'Verified' : 'Pending';

                return `
                    <div class="post-card fade-in">
                        <div class="post-header">
                            <img src="https://ui-avatars.com/api/?name=${post.username || 'User'}&background=2e7d32&color=fff&size=40"
                                 class="post-avatar" alt="${post.username}">
                            <span class="post-user">${post.username || 'Anonymous'}</span>
                            <span class="post-time">• ${timeAgo(post.created_at)}</span>
                            <button class="post-more"><i class="fas fa-ellipsis-h"></i></button>
                        </div>

                        <div class="post-image-wrapper">
                            <img src="${post.image_url || 'https://picsum.photos/800/600'}" class="post-image" alt="Post"
                                 onerror="this.src='https://picsum.photos/800/600'">
                            <div class="verification-overlay ${badgeClass}">
                                <i class="fas ${badgeIcon}"></i> ${badgeText}
                            </div>
                            ${post.points > 0 ? `
                                <div class="points-overlay">
                                    <i class="fas fa-leaf"></i> +${post.points} pts
                                </div>
                            ` : ''}
                        </div>

                        <div class="post-actions">
                            <button class="action-btn" onclick="likePost('${post.id}', this)">
                                <i class="far fa-heart"></i>
                            </button>
                            <button class="action-btn" onclick="alert('Comments coming soon!')">
                                <i class="far fa-comment"></i>
                            </button>
                            <button class="action-btn" onclick="alert('Share coming soon!')">
                                <i class="far fa-paper-plane"></i>
                            </button>
                            <span class="action-spacer"></span>
                            <button class="action-btn" onclick="verifyPost('${post.id}')" title="Verify with AI">
                                <i class="fas fa-shield-alt"></i>
                            </button>
                            <button class="action-btn" onclick="alert('Saved!')">
                                <i class="far fa-bookmark"></i>
                            </button>
                        </div>

                        <div class="post-meta">
                            <span class="like-count">${post.likes || 0}</span> likes
                        </div>

                        <div class="post-caption">
                            <span class="username">${post.username || 'Anonymous'}</span>
                            <span class="caption-text">
                                ${post.caption || ''}
                                ${post.hashtags ? post.hashtags.split(',').map(t =>
                                    ` <a href="#" class="hashtag">#${t.trim()}</a>`
                                ).join('') : ''}
                            </span>
                        </div>

                        ${post.comments_count > 0 ? `
                            <div class="post-comments">
                                <div class="comment">
                                    <span class="cm-username">${post.username || 'User'}</span>
                                    <span>${post.caption ? post.caption.split(' ').slice(0, 8).join(' ') + '...' : ''}</span>
                                </div>
                                <span class="view-all">View all ${post.comments_count} comments</span>
                            </div>
                        ` : ''}

                        <div class="post-timestamp">${new Date(post.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}</div>
                    </div>
                `;
            }).join('');
        }

        function renderEmptyState() {
            feedContainer.innerHTML = `
                <div class="empty-state fade-in">
                    <div class="icon-wrapper"><i class="fas fa-leaf"></i></div>
                    <h4>No good deeds yet</h4>
                    <p>Be the first to share a positive impact and inspire others.</p>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
                        <i class="fas fa-plus me-1"></i> Create First Post
                    </button>
                </div>
            `;
        }

        function renderMockPosts() {
            const mockPosts = [
                {
                    id: '1', username: 'EcoWarrior',
                    image_url: 'https://picsum.photos/seed/tree/800/600',
                    caption: 'Planted 50 trees in our community park! 🌳 Every tree counts.',
                    hashtags: 'GreenEarth, PlantATree',
                    is_verified: true, points: 25, likes: 45, comments_count: 12,
                    created_at: new Date(Date.now() - 3600000).toISOString()
                },
                {
                    id: '2', username: 'OceanHero',
                    image_url: 'https://picsum.photos/seed/ocean/800/600',
                    caption: 'Cleaned 200kg of plastic from the beach today! 🏖️',
                    hashtags: 'SaveTheOcean, CleanBeach',
                    is_verified: true, points: 30, likes: 67, comments_count: 23,
                    created_at: new Date(Date.now() - 7200000).toISOString()
                },
                {
                    id: '3', username: 'FoodAngel',
                    image_url: 'https://picsum.photos/seed/food/800/600',
                    caption: 'Distributed food to 100 homeless families 🍲',
                    hashtags: 'EndHunger, FoodForAll',
                    is_verified: false, points: 20, likes: 34, comments_count: 18,
                    created_at: new Date(Date.now() - 10800000).toISOString()
                }
            ];
            renderPosts(mockPosts);
        }

        function createPost() {
            const caption = document.getElementById('caption').value.trim();
            const location = document.getElementById('location').value.trim();
            const hashtags = document.getElementById('hashtags').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim() || 'https://picsum.photos/800/600';

            if (!caption) { alert('Please describe your good deed!'); return; }

            const payload = { caption, location, hashtags, image_url: imageUrl };

            fetch(`${API_BASE}/create/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(() => {
                bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
                document.getElementById('caption').value = '';
                document.getElementById('location').value = '';
                document.getElementById('hashtags').value = '';
                document.getElementById('imageUrl').value = 'https://picsum.photos/800/600';
                loadFeed();
            })
            .catch(() => {
                alert('✅ Post created! (Demo mode)');
                bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
                loadFeed();
            });
        }

        function likePost(postId, btn) {
            fetch(`${API_BASE}/${postId}/like/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                const card = btn.closest('.post-card');
                const likeCount = card.querySelector('.like-count');
                if (likeCount) likeCount.textContent = data.likes || parseInt(likeCount.textContent) + 1;
                btn.classList.toggle('liked');
                const icon = btn.querySelector('i');
                if (btn.classList.contains('liked')) {
                    icon.classList.remove('far');
                    icon.classList.add('fas');
                } else {
                    icon.classList.remove('fas');
                    icon.classList.add('far');
                }
            })
            .catch(() => {
                // optimistic
                const card = btn.closest('.post-card');
                const likeCount = card.querySelector('.like-count');
                if (likeCount) likeCount.textContent = parseInt(likeCount.textContent) + 1;
                btn.classList.add('liked');
                btn.querySelector('i').className = 'fas fa-heart';
            });
        }

        function verifyPost(postId) {
            fetch(`${API_BASE}/${postId}/verify/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.is_verified) {
                    alert(`✅ Verified! Confidence: ${Math.round(data.verification_score * 100)}%`);
                } else {
                    alert(`⚠️ Needs review. Confidence: ${Math.round(data.verification_score * 100)}%`);
                }
                loadFeed();
            })
            .catch(() => alert('🔍 Verification in progress...'));
        }

        function timeAgo(dateString) {
            const now = new Date();
            const past = new Date(dateString);
            const diff = Math.floor((now - past) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
            if (diff < 604800) return `${Math.floor(diff / 86400)}d`;
            return `${Math.floor(diff / 604800)}w`;
        }

        tabContainer.addEventListener('click', function(e) {
            const tab = e.target.closest('.tab-btn');
            if (tab) {
                const type = tab.dataset.type;
                loadFeed(type);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadStories();
            loadFeed('all');
        });
    </script>
{% endblock %}
